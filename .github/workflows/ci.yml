name: Validate game logic

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: npm run check
      - name: Gameplay tests
        run: npm test
      - name: Enumerate narrative paths
        run: npm run story-paths
      - name: Validate first-pass economy balance
        run: npm run balance
