name: Deploy Ranch Life to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile and smoke-test
        run: npm run build
      - name: Validate browser release surface
        run: npm run release-check
      - name: Prepare clean browser artifact
        run: |
          mkdir -p _site
          cp index.html favicon.svg manifest.webmanifest _site/
          cp -R css js assets vendor _site/
      - name: Check whether Pages is enabled
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages-site.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages 尚未启用"
              echo ""
              echo "GitHub 不允许 GITHUB_TOKEN 创建第一个 Pages 站点。"
              echo "请在 **Settings → Pages → Build and deployment** 将 Source 设为 **GitHub Actions**，然后重新运行本工作流。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Pages setup required::Open Settings → Pages and choose GitHub Actions as the source, then rerun this workflow."
          fi
      - name: Configure Pages
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        if: steps.pages_status.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
